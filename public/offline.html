<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6D28D9" />
    <title>Perfect Pupil - Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 60%, #ecfeff 100%);
        color: #0f172a;
      }
      .card {
        max-width: 460px;
        margin: 24px;
        padding: 24px;
        border-radius: 16px;
        border: 1px solid #cbd5e1;
        background: #ffffff;
        box-shadow: 0 12px 34px rgba(15, 23, 42, 0.08);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.25rem;
      }
      p {
        margin: 0 0 16px;
        line-height: 1.4;
        color: #334155;
      }
      button {
        padding: 10px 16px;
        border: 0;
        border-radius: 10px;
        background: #6d28d9;
        color: #fff;
        cursor: pointer;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>
        Perfect Pupil needs a network connection for companion data and cloud features.
        Reconnect and try again.
      </p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
